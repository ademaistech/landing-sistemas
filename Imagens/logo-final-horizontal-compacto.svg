<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120">
  <rect width="700" height="120" fill="#FFFFFF"/>

  <!-- LOGO HORIZONTAL COMPACTO — para headers, assinaturas de email, rodapes -->
  <g transform="translate(20, 15)">
    <!-- Barras reduzidas -->
    <rect x="0" y="30" width="10" height="30" rx="3" fill="#7B2FF7" opacity="0.15"/>
    <rect x="14" y="20" width="10" height="50" rx="3" fill="#7B2FF7" opacity="0.30"/>
    <rect x="28" y="10" width="10" height="70" rx="3" fill="#7B2FF7" opacity="0.55"/>

    <rect x="42" y="2" width="12" height="86" rx="4" fill="#7B2FF7"/>

    <rect x="58" y="10" width="10" height="70" rx="3" fill="#1A1A2E" opacity="0.50"/>
    <rect x="72" y="20" width="10" height="50" rx="3" fill="#1A1A2E" opacity="0.30"/>
    <rect x="86" y="30" width="10" height="30" rx="3" fill="#1A1A2E" opacity="0.15"/>
  </g>

  <!-- Texto inline -->
  <text x="130" y="55" font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="38" fill="#0D0D0D" letter-spacing="-1.5">
    ademais
  </text>
  <text x="130" y="82" font-family="Inter, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-weight="500" font-size="18" fill="#7B2FF7" letter-spacing="2">
    — tech
  </text>

  <text x="580" y="108" font-family="Inter, Arial, sans-serif" font-weight="400" font-size="9" fill="#8A8F99" letter-spacing="2" opacity="0.4">
    HORIZONTAL COMPACTO
  </text>
</svg>